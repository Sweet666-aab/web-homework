<!DOCTYPE html><html lang="en"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>二级水平导航菜单</title>
 <style>
    /* 全局重置 通配选择器，盒模型初始化 */
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* 后代选择器：清除列表默认圆点 */
    ul{
        list-style: none;
    }
    /* 类选择器 .logo */
    .logo{
        font-size: 22px;
        font-weight: bold;
        padding:15px 30px;
        color:#23529c;
    }
    /* 后代选择器：导航一级ul，flex实现水平排列 */
    body>ul:nth-child(2){
        display: flex;
        background-color:#23529c;
    }
    /* 后代选择器：一级li，子绝父相，为二级下拉做定位 */
    body>ul:nth-child(2) > li{
        position: relative;
    }
    /* 后代选择器：导航链接a，盒模型padding扩大点击区域 */
    body>ul:nth-child(2) li a{
        display:block;
        padding:14px 18px;
        text-decoration:none;
        color:#fff;
        font-size:16px;
    }
    /* :hover伪类，一级菜单悬浮变色 */
    body>ul:nth-child(2) > li > a:hover{
        background-color:#428bca;
    }
    /* 后代选择器：二级子菜单ul，绝对定位 */
    body>ul:nth-child(2) li ul{
        position:absolute;
        top:100%;
        left:0;
        background:#fff;
        display:none; /* 默认隐藏二级菜单 */
        box-shadow: 0 2px 5px #ccc;
    }
    /* 并集选择器：二级菜单a标签样式 */
    body>ul:nth-child(2) li ul li a{
        color:#23529c;
        white-space: nowrap;
    }
    /* 二级菜单悬浮 */
    body>ul:nth-child(2) li ul li a:hover{
        background:#e8f0fb;
    }
    /* 悬浮一级li，显示二级菜单 */
    body>ul:nth-child(2) li:hover > ul{
        display:block;
    }
 </style>
</head><body>
 <ul>
 <li class="logo">欢迎访问湖南文理学院</li>
 </ul>
 <ul>
 <li><a href="#">首页</a></li>
 <li><a href="#">教学院(部)</a>
 <ul>
 <li><a href="#">计算机与电气工程学院</a></li>
 <li><a href="#">芙蓉学院</a></li>
 </ul>
 </li>
 <li><a href="#">党群机构</a></li>
 <li><a href="#">行政教辅机构</a></li>
 <li><a href="#">教学科研</a></li>
 <li><a href="#">招生就业</a></li>
 <li><a href="#">国际交流</a></li>
 <li><a href="#">数字图书馆</a></li>
 </ul>
</body></html>
